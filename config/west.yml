# ZMK at main (the modules build against ZMK main's Zephyr 4.1; neither is
# built against a ZMK release), and zmk-vfx-lantern and zmk-vfx-beacon as west
# projects, pinned by commit. Each module's README, "Using it in a ZMK config",
# is what this repository follows.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: akira-toriyama
      url-base: https://github.com/akira-toriyama
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-vfx-lantern
      remote: akira-toriyama
      revision: ea671482e9f9c550d4adc4f3dc607d7e804bd292
      path: modules/zmk-vfx-lantern
    - name: zmk-vfx-beacon
      remote: akira-toriyama
      revision: 2a3bbc586526034c25af84998f812e68ecec3770
      path: modules/zmk-vfx-beacon
  self:
    path: config

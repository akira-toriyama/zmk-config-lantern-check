# ZMK at main (the module builds against ZMK main's Zephyr 4.1; it is not
# built against a ZMK release) and zmk-lantern as a west project, pinned by
# commit. The module's README, "Using it in a ZMK config", is what this
# repository follows.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: akira-toriyama
      url-base: https://github.com/akira-toriyama
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-lantern
      remote: akira-toriyama
      revision: 44a0c83f0731acd7548c72cf4f621aa1b356d0e5
      path: modules/zmk-lantern
  self:
    path: config

# Both halves. The module paints the strip; ZMK's underglow stays off.
CONFIG_ZMK_RGB_UNDERGLOW=n

# The colours until the host hands a palette.
CONFIG_LANTERN_COLOUR_0=0x2060FF
CONFIG_LANTERN_COLOUR_1=0xFF4000

# The effects, the intro and the tempo to build.
CONFIG_LANTERN_THIN_RING=y
CONFIG_LANTERN_CROSS_RING=y
CONFIG_LANTERN_INTRO_STAR_WAVES=y
CONFIG_LANTERN_TEMPO=y

# The left half, the split central: the palette's and the picks' resends read
# the half's battery reports, and the run queue holds a whole palette and all
# three picks for the one peripheral at once.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=6

# The port: USB_CDC_ACM needs SERIAL, which nothing else on the nice!nano
# turns on; with the port node of config/corne_left.overlay, CONFIG_USB_CDC_ACM
# and CONFIG_LANTERN_PORT then default on.
CONFIG_SERIAL=y

# The left half, the split central: the palette's and the picks' resends read
# the half's battery reports, and zmk-vfx-beacon's status advertisement carries
# them; the run queue holds a whole palette and all three picks for the one
# peripheral at once.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=6

# The port: USB_CDC_ACM needs SERIAL, which nothing else on the nice!nano
# turns on; with the port node of config/corne_left.overlay, CONFIG_USB_CDC_ACM
# and CONFIG_LANTERN_PORT then default on.
CONFIG_SERIAL=y

# zmk-vfx-beacon's broadcaster, the status advertisement a Prospector Dongle
# shows. It selects BT_EXT_ADV, under which ZMK's own advertising takes one
# set of the pool: 2, or zmk-vfx-beacon's BUILD_ASSERT stops the build.
CONFIG_BEACON_STATUS_BROADCAST=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# zmk-vfx-beacon's reflash from the host: 1200 baud on the port above reboots the
# half into its UF2 bootloader (the nice!nano's board has the boot mode's
# retention).
CONFIG_BEACON_BOOTLOADER_ON_1200_BAUD=y
